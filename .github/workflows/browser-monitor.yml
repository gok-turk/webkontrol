name: Browser monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: browser-monitoring
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: config
        env:
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
        run: |
          if [ -n "$MONITOR_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Set the MONITOR_API_TOKEN repository secret after enabling browser mode in WebKontrol.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Install browser dependencies
        if: steps.config.outputs.ready == 'true'
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check sites in Chromium
        if: steps.config.outputs.ready == 'true'
        working-directory: browser
        env:
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
          MONITOR_PANEL_URL: ${{ vars.MONITOR_PANEL_URL || 'https://kontrol.mg.web.tr/webkontrol/public/' }}
        run: npm run check
